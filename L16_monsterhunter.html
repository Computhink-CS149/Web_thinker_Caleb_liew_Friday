<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monster Hunter</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Courier New", monospace;
        background: #100d23;
        color: #f8ebff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background-image:
          linear-gradient(#21183b 1px, transparent 1px),
          linear-gradient(90deg, #21183b 1px, transparent 1px);
        background-size: 24px 24px;
      }

      main {
        width: min(100%, 960px);
        padding: 16px;
        background: #100d23;
        border: 4px solid #f5f36d;
        box-shadow: 8px 8px 0 #ff4f87;
      }

      a {
        color: #31d7d1;
        font-weight: bold;
        text-decoration-thickness: 2px;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        border: 3px solid #ff4f87;
        image-rendering: pixelated;
      }

      main > p:last-child {
        color: #f5f36d;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.35.5/planck.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.35.5/p5play.min.js"></script>
  </head>
  <body>
    <main>
      <p><a href="index.html">← Back to homepage</a></p>
      <div id="game"></div>
      <p>Move with ←/→, jump with ↑, and hold Space to shoot.</p>
    </main>
    <script src="L16_monsterhunter.js"></script>
  </body>
</html>
